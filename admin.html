<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>企业管理控制台</title>
<style>
*{margin:0;padding:0;font-family:微软雅黑}
.top{background:#165DFF;color:#fff;padding:18px;font-size:22px}
.menu{background:#f0f3f9;padding:12px;display:flex;gap:20px}
.menu span{padding:6px 12px;background:#165DFF;color:#fff;border-radius:4px}
.main{padding:20px}
.card{border:1px solid #ddd;padding:16px;border-radius:8px;margin-bottom:15px;width:48%;float:left;margin-right:2%}
</style>
</head>
<body>
<div class="top">企业版管理后台 · 数据实训平台</div>
<div class="menu">
<span>企业信息配置</span>
<span>学员批量管理</span>
<span>订单&权限开通</span>
<span>学习数据看板</span>
<span>题库管理导入</span>
</div>
<div class="main">
<div class="card">
<h3>学员管理</h3>
<p>Excel批量导入账号、开通有效期、分组部门</p>
</div>
<div class="card">
<h3>订单管理</h3>
<p>微信收款订单记录、手动/自动开通会员权限</p>
</div>
<div class="card">
<h3>学习报表</h3>
<p>完成率、错题统计、部门技能排行导出</p>
</div>
<div class="card">
<h3>题库配置</h3>
<p>JSON一键导入新增行业题目包</p>
</div>
</div>
</body>
</html>
