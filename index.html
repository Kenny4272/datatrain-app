<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>数据技能实训平台-登录</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft YaHei"}
body{background:#f5f7fa;padding-top:80px;}
.login-box{width:380px;margin:0 auto;background:#fff;padding:35px;border-radius:10px;box-shadow:0 0 12px #e4e7ed;}
h2{text-align:center;color:#333;margin-bottom:30px;}
.item{margin-bottom:20px;}
label{display:block;margin-bottom:8px;color:#555;}
input{width:100%;padding:12px;border:1px solid #ddd;border-radius:6px;font-size:15px;}
.btn{width:100%;padding:13px;background:#165DFF;color:#fff;border:none;border-radius:6px;font-size:16px;margin-top:10px;cursor:pointer;}
.link-box{margin-top:20px;text-align:center;}
a{color:#165DFF;text-decoration:none;margin:0 10px;}
</style>
</head>
<body>
<div class="login-box">
    <h2>实训平台登录</h2>
    <div class="item">
        <label>账号</label>
        <input id="user" placeholder="学员/管理员账号">
    </div>
    <div class="item">
        <label>密码</label>
        <input id="pwd" type="password" placeholder="登录密码">
    </div>
    <button class="btn" onclick="login()">登录进入</button>
    <div class="link-box">
        <a href="home.html">游客体验首页</a>
    </div>
</div>
<script>
//简易登录：admin进后台，任意账号进学员页
function login(){
    let u = document.getElementById('user').value;
    if(u=='admin')location.href='admin.html';
    else location.href='home.html';
}
</script>
</body>
</html>
