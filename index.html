<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#165DFF">
<title>数据技能实训平台</title>
<!-- PWA配置 -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#f7f8fa;padding:15px}
.top-nav{display:flex;background:#fff;border-radius:10px;overflow:hidden;margin-bottom:20px;box-shadow:0 2px 8px #eee}
.top-nav a{flex:1;text-align:center;padding:14px 0;text-decoration:none;color:#333;border-right:1px solid #efefef;font-size:15px}
.top-nav a:last-child{border:none}
.top-nav a.vip{color:#165DFF;font-weight:bold}
.box-card{background:#fff;border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 1px 6px #eee}
h3{margin-bottom:12px;color:#222}
.desc{color:#666;font-size:14px;margin-bottom:18px;line-height:1.6}
.btn{display:inline-block;padding:10px 22px;background:#165DFF;color:#fff;border-radius:8px;text-decoration:none;border:none;font-size:15px}
.btn:hover{background:#0f4cdb}
</style>
</head>
<body>

<!-- 顶部导航：开通会员→pay.html、产品介绍→home.html、管理后台→admin.html -->
<div class="top-nav">
    <a href="home.html">产品介绍</a>
    <a href="pay.html" class="vip">开通会员</a>
    <a href="admin.html">管理后台</a>
</div>

<!-- 制造业题库模块 -->
<div class="box-card">
    <h3>制造业质量管理题库</h3>
    <p class="desc">IATF16949、FMEA、MSA、SPC、PPAP全套考题，在线刷题练习</p>
    <a href="#train" class="btn">开始练习</a>
</div>

<!-- 电商数据分析题库 -->
<div class="box-card">
    <h3>电商GMV数据分析题库</h3>
    <p class="desc">Excel、Power Query、DAX实战题目，企业真实业务场景出题</p>
    <a href="#gmv" class="btn">开始练习</a>
</div>

<!-- 数据导入区域 -->
<div class="box-card">
    <h3>自定义题目导入</h3>
    <p class="desc">上传question.json题库文件，批量导入自定义考题</p>
    <a href="#data" class="btn">导入数据</a>
</div>

<!-- 题库锚点区域 -->
<div id="train" class="box-card">
    <h3>制造业题库专区</h3>
    <p class="desc">题目读取自question.json，页面加载自动渲染考题</p>
</div>
<div id="gmv" class="box-card">
    <h3>电商数据分析专区</h3>
    <p class="desc">海量业务计算题，会员解锁全部答案解析</p>
</div>
<div id="data" class="box-card">
    <h3>题库上传区</h3>
    <p class="desc">替换根目录question.json即可更新全套题库</p>
</div>

<!-- PWA注册 -->
<script>
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./service-worker.js')
}
</script>
</body>
</html>
