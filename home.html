<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>学员实训中心</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft YaHei"}
.top{background:#165DFF;color:#fff;padding:18px;font-size:24px;}
.nav{background:#f0f3f9;padding:15px;display:flex;gap:15px;flex-wrap:wrap;}
.nav a{padding:9px 16px;background:#165DFF;color:#fff;border-radius:6px;text-decoration:none;}
.content{padding:20px;max-width:900px;margin:0 auto;}
.que-box{border:1px solid #e5e7eb;padding:20px;border-radius:8px;margin-bottom:18px;}
.opt{margin:8px 0;padding:6px;cursor:pointer;}
.ans{margin-top:12px;color:#096;font-weight:bold;display:none;}
.operate button{padding:8px 14px;margin-right:10px;background:#165DFF;color:#fff;border:none;border-radius:5px;cursor:pointer;}
</style>
</head>
<body>
<div class="top">数据实训｜学员练习中心</div>
<div class="nav">
    <a href="home.html">刷题练习</a>
    <a href="pay.html">会员开通</a>
    <a href="admin.html">管理员后台</a>
    <a href="index.html">返回登录</a>
</div>
<div class="content">
    <div id="qlist"></div>
</div>
<script>
//空白题库，后续在后台admin配置新增题目，当前预置2道演示题
let qData = [
    {q:"Power Query拆分文本常用函数是？",opt:["Text.Split","List.Sum","Table.SelectRows"],right:0,ans:"答案：Text.Split用于字符串拆分"},
    {q:"SQL筛选条件关键字？",opt:["ORDER BY","WHERE","GROUP BY"],right:1,ans:"答案：WHERE做条件筛选"}
];
let html='';
qData.forEach((item,idx)=>{
    html += `<div class="que-box">
    <p>第${idx+1}题：${item.q}</p>
    <div class="opts">
        ${item.opt.map((o,i)=>`<div class="opt" onclick="check(${idx},${i})">${String.fromCharCode(65+i)}.${o}</div>`).join('')}
    </div>
    <div class="ans" id="a${idx}">${item.ans}</div>
    <div class="operate" style="margin-top:10px">
        <button onclick="showAns(${idx})">查看答案</button>
    </div>
    </div>`;
})
document.getElementById('qlist').innerHTML=html;
//答题校验
function check(qidx,oidx){
    let item=qData[qidx];
    if(oidx==item.right)alert('回答正确！');
    else alert('回答错误，请查看答案');
}
function showAns(i){document.getElementById('a'+i).style.display='block'}
</script>
</body>
</html>
