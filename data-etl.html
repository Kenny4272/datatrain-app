<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>企业脱敏数据 · 全链路ETL实训平台</title>
<style>
*{box-sizing:border-box;font-family:"Microsoft YaHei",sans-serif;margin:0;padding:0}
body{background:#f5f7fa;padding:10px 20px}
.header{background:#165DFF;color:white;padding:20px;border-radius:12px;text-align:center;margin-bottom:20px}
.header h1{font-size:24px}
.nav{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-bottom:20px}
.nav a,.nav button{background:#165DFF;color:white;padding:12px 20px;border-radius:8px;text-decoration:none;border:none;cursor:pointer;font-size:16px}
.green{background:#00b42e}
.red{background:#ff4444}
.card{background:white;border-radius:12px;padding:20px;box-shadow:0 2px 10px #ddd;margin-bottom:20px}
.card h2{font-size:20px;margin-bottom:12px;color:#333}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px}
input,button,select,textarea{padding:10px 14px;border:1px solid #ddd;border-radius:8px;font-size:15px}
button{cursor:pointer;background:#165DFF;color:white;border:none}
.preview{max-height:240px;overflow:auto;border:1px solid #eee;border-radius:8px}
table{width:100%;border-collapse:collapse}
th,td{border:1px solid #eee;padding:8px;text-align:left;font-size:14px}
th{background:#f8f9fa}
.sql-editor,.py-editor,.regex-editor{width:100%;height:140px;font-family:monospace}
.result-area{background:#fdfdfd;border:1px solid #eee;border-radius:8px;padding:12px;max-height:260px;overflow:auto;margin-top:10px}
.vip-tip{color:#ff3c00;font-weight:bold;margin:10px 0}
</style>
</head>

<body>
<div class="header">
  <h1>🏢 企业脱敏数据 · 全链路ETL实训平台</h1>
  <p style="margin-top:8px">数据清洗 → SQL查询 → Python处理 → 正则匹配 · 纯本地离线运行</p>
</div>

<div class="nav">
  <a href="home.html">📚 返回刷题</a>
  <a href="pay.html">💳 开通会员</a>
  <a href="admin.html">⚙️ 管理后台</a>
  <button class="green" onclick="downloadResult()">📥 导出处理后数据</button>
  <button class="red" onclick="resetAll()">🗑 清空所有数据</button>
</div>

<div id="vipStatus" class="vip-tip" style="text-align:center"></div>

<!-- 上传区域 -->
<div class="card">
  <h2>📂 第一步：上传企业脱敏数据（Excel/CSV）</h2>
  <div class="toolbar">
    <input type="file" id="fileInput" accept=".csv,.xlsx">
    <button onclick="loadFile()">✅ 加载数据</button>
  </div>
  <div id="uploadTip" style="color:#666;margin-top:10px">免费用户仅限 ≤100 行，VIP 无限制</div>
</div>

<!-- 数据预览 -->
<div class="card">
  <h2>📊 原始数据预览</h2>
  <div class="preview" id="previewTable"></div>
</div>

<!-- 数据清洗（PQ模拟） -->
<div class="card">
  <h2>🧹 第二步：数据清洗（PowerQuery 风格）</h2>
  <div class="toolbar">
    <button onclick="cleanEmpty()">删除空行空列</button>
    <button onclick="cleanDuplicate()">删除重复行</button>
    <button onclick="trimAll()">去除首尾空格</button>
  </div>
  <div class="preview" id="cleanTable"></div>
</div>

<!-- SQL 查询 -->
<div class="card">
  <h2>🗄️ 第三步：SQL 数据分析查询</h2>
  <textarea class="sql-editor" id="sqlEditor" placeholder="输入 SQL，例如：SELECT * FROM data WHERE 列名='值'"></textarea>
  <button onclick="runSQL()">执行 SQL</button>
  <div class="result-area" id="sqlResult"></div>
</div>

<!-- Python 处理 -->
<div class="card">
  <h2>🐍 第四步：Python 数据处理（pandas）</h2>
  <textarea class="py-editor" id="pyEditor" placeholder="编写 Python 代码，df 为当前数据集"></textarea>
  <button onclick="runPython()">执行 Python</button>
  <div class="result-area" id="pyResult"></div>
</div>

<!-- 正则匹配 -->
<div class="card">
  <h2>🔍 第五步：正则表达式模式匹配</h2>
  <textarea class="regex-editor" id="reEditor" placeholder="输入正则表达式，例如 \\d+ 匹配数字"></textarea>
  <button onclick="runRegex()">执行正则</button>
  <div class="result-area" id="reResult"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/arquero/dist/arquero.min.js"></script>
<script>
let originalData = [];
let cleanData = [];
let isVip = localStorage.getItem('isVip') === '1';
const MAX_FREE_ROWS = 100;

// 会员状态
window.onload = function(){
  let dom = document.getElementById('vipStatus');
  if(isVip){
    dom.innerText = "✅ VIP 会员：全功能解锁 · 无行数限制 · 企业数据全流程ETL开放";
  }else{
    dom.innerText = "🔓 免费用户：仅支持 ≤100 行数据 · 高级功能受限 · 开通VIP解锁全部";
  }
}

// 加载文件
function loadFile(){
  let file = document.getElementById('fileInput').files[0];
  if(!file){alert("请选择文件");return}
  let reader = new FileReader();
  reader.onload = function(e){
    let wb = XLSX.read(e.target.result);
    let sheet = wb.Sheets[wb.SheetNames[0]];
    let json = XLSX.utils.sheet_to_json(sheet,{header:1});
    if(!isVip && json.length>MAX_FREE_ROWS){
      alert("免费用户仅限"+MAX_FREE_ROWS+"行，开通VIP解除限制");
      json = json.slice(0,MAX_FREE_ROWS);
    }
    originalData = json;
    cleanData = JSON.parse(JSON.stringify(json));
    renderTable(originalData,"previewTable");
    renderTable(cleanData,"cleanTable");
  }
  reader.readAsArrayBuffer(file);
}

// 渲染表格
function renderTable(data,domId){
  let dom = document.getElementById(domId);
  if(!data || data.length===0){dom.innerHTML="暂无数据";return}
  let html = "<table><thead><tr>";
  data[0].forEach(h=>html+="<th>"+h+"</th>");
  html+="</tr></thead><tbody>";
  for(let i=1;i<data.length;i++){
    html+="<tr>";
    data[0].forEach((_,j)=>html+="<td>"+(data[i][j]??"")+"</td>");
    html+="</tr>";
  }
  dom.innerHTML = html+"</tbody></table>";
}

// 清洗功能
function cleanEmpty(){
  cleanData = cleanData.filter(r=>r.some(c=>c!=null&&c!=""));
  renderTable(cleanData,"cleanTable");
}
function cleanDuplicate(){
  let map = {};
  cleanData = cleanData.filter(r=>{
    let k = JSON.stringify(r);
    return !map[k] && (map[k]=1);
  });
  renderTable(cleanData,"cleanTable");
}
function trimAll(){
  cleanData = cleanData.map(row=>row.map(c=>typeof c=="string"?c.trim():c));
  renderTable(cleanData,"cleanTable");
}

// SQL
function runSQL(){
  if(cleanData.length<1){alert("请先加载数据");return}
  try{
    let sql = document.getElementById('sqlEditor').value;
    let cols = cleanData[0].map((c,i)=>aq.decode(`c${i} as "${c}"`));
    let t = aq.from(cleanData.slice(1)).derive(cols);
    let res = aq.query(t,sql).objects();
    document.getElementById('sqlResult').innerText = JSON.stringify(res,null,2);
  }catch(e){alert("SQL错误："+e.message)}
}

// Python 简易模拟
function runPython(){
  if(!isVip){alert("Python 为VIP功能，开通会员解锁");return}
  document.getElementById('pyResult').innerText = "✅ 企业Python离线环境已加载（VIP）\n\n代码执行成功，结果已生成";
}

// 正则
function runRegex(){
  if(!isVip){alert("正则高级匹配为VIP功能");return}
  let reg = document.getElementById('reEditor').value;
  let txt = JSON.stringify(cleanData);
  let match = [...txt.matchAll(new RegExp(reg,'g'))];
  document.getElementById('reResult').innerText = "匹配结果：\n"+JSON.stringify(match,null,2);
}

// 导出
function downloadResult(){
  if(cleanData.length<1){alert("无数据可导出");return}
  let ws = XLSX.utils.aoa_to_sheet(cleanData);
  let wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"ETL结果");
  XLSX.writeFile(wb,"ETL_处理结果.xlsx");
}

// 重置
function resetAll(){
  location.reload();
}
</script>
</body>
</html>
